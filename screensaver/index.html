<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TrailerHero</title>
<style>
@font-face{font-family:"Motiva Sans";src:url("steam-ui-font.ttf") format("truetype");font-weight:500}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;color:white;font-family:Motiva Sans,Arial,sans-serif}.scene{position:absolute;inset:0;opacity:0;transition:opacity 900ms cubic-bezier(.22,.61,.36,1)}.scene.visible{opacity:1}.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:1}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 24%,transparent 65%,rgba(0,0,0,.65));pointer-events:none}header{z-index:3;position:absolute;top:0;left:0;display:flex;align-items:baseline;gap:0;white-space:nowrap;text-shadow:0 2px 8px #000;font-size:16px;font-weight:500;line-height:36.8px;padding:0 12px}#clock,#date,#weather{font:inherit}#date{margin-left:.55em;margin-right:.34em}#weather{display:inline-flex;align-items:baseline;gap:.16em;margin-left:.34em}#weather-icon{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;font-size:calc(.82em + 5px);line-height:1;transform:translateY(.04em)}.brand{position:absolute;left:4vw;bottom:6vh;max-width:28vw;max-height:17vh;filter:drop-shadow(0 2px 12px #000)}.logo{display:none;max-width:28vw;max-height:17vh;width:auto;height:auto;object-fit:contain;object-position:left bottom}.name{font-size:clamp(22px,3vw,72px);font-weight:700;line-height:1.12;text-shadow:0 2px 16px #000}#status{position:absolute;bottom:5vh;right:4vw;font-size:16px;color:#ccc;letter-spacing:.02em}
#loading{z-index:4;position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px;border:3px solid #ffffff30;border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;filter:drop-shadow(0 2px 8px #000)}#loading[hidden]{display:none}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><div class="scene" id="scene0"><video id="video0" muted playsinline preload="auto"></video><audio id="audio0" preload="auto"></audio><div class="shade"></div><div class="brand"><img id="logo0" class="logo" alt=""><div id="name0" class="name"></div></div></div><div class="scene" id="scene1"><video id="video1" muted playsinline preload="auto"></video><audio id="audio1" preload="auto"></audio><div class="shade"></div><div class="brand"><img id="logo1" class="logo" alt=""><div id="name1" class="name"></div></div></div><header><span id="clock"></span><span id="date"></span><span id="weather"><span id="weather-icon"></span><span id="weather-temp"></span></span></header><div id="loading" role="status" aria-label="Loading"></div><div id="status"></div><script src="main.js"></script></body></html>
